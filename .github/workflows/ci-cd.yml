name: CI/CD — CRMLite Backend

on:
  push:
    branches: [main, develop]
    paths: ['CRMLiteBackedn/**']
  pull_request:
    branches: [main]
    paths: ['CRMLiteBackedn/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crmlite-backend
  JAVA_VERSION: '17'

jobs:

  # ── Stage 1: Lint & Compile ──────────────────────────────────────────────
  lint-and-compile:
    name: Lint & Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRMLiteBackedn
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -B -q

  # ── Stage 2: Unit Tests ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-compile
    defaults:
      run:
        working-directory: CRMLiteBackedn
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -B -Dtest='**/*Test' -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          MAVEN_OPTS: "-Xmx2048m"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: CRMLiteBackedn/target/surefire-reports/*.xml
          reporter: java-junit

  # ── Stage 3: SAST & Dependency Check ────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: compile
    defaults:
      run:
        working-directory: CRMLiteBackedn
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=owasp-suppressions.xml \
            -B -q
        continue-on-error: true    # Report but don't block for now

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: CRMLiteBackedn/target/dependency-check-report.html

  # ── Stage 4: Docker Build & Scan ─────────────────────────────────────────
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: CRMLiteBackedn
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: CRMLiteBackedn
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 5: Deploy to Staging ───────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging via kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          kubectl --kubeconfig=kubeconfig.yaml set image deployment/crmlite-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -n crmlite-staging
          kubectl --kubeconfig=kubeconfig.yaml rollout status deployment/crmlite-backend \
            -n crmlite-staging --timeout=5m

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://staging.crmlite.io/actuator/health || exit 1

  # ── Stage 6: Deploy to Production ────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production    # Requires manual approval in GitHub Environments
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Update production image tag (GitOps)
        run: |
          # Update the image tag in the k8s manifest and push to trigger ArgoCD
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}|" \
            deployment/k8s/production.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/k8s/production.yaml
          git commit -m "chore: bump backend image to sha-${{ github.sha }}"
          git push

      - name: Wait for ArgoCD sync
        run: |
          # ArgoCD watches the repo and auto-syncs production.yaml
          echo "ArgoCD will detect the commit and sync. Monitoring rollout..."
          sleep 60
          curl -f https://app.crmlite.io/actuator/health || exit 1
