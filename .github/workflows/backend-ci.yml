name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build Backend with Maven
      run: mvn -B package --file pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test
        MAVEN_OPTS: "-Xmx2048m"
