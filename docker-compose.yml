version: '3.8'

services:
  # ── PostgreSQL Database with pgvector (Max ~150MB) ──
  db:
    image: pgvector/pgvector:pg17
    container_name: chatcrm_db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB"]
    mem_limit: 80m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatcrmdb}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${POSTGRES_DB:-chatcrmdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crmlite-network

  # ── Redis Cache & PubSub (Max ~45MB) ──
  redis:
    image: redis:7-alpine
    container_name: chatcrm_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "10mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 14m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crmlite-network

  # ── Spring Boot Backend (Max ~750MB) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatcrm_backend
    restart: unless-stopped
    mem_limit: 600m
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xmx256m -Xms256m"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chatcrmdb}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crmlite-network

volumes:
  postgres_data:
  redis_data:

networks:
  crmlite-network:
    driver: bridge
