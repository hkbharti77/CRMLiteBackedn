  # ── Neo4j (optional Graph RAG; not required for VECTOR mode) ──
  neo4j:
    image: neo4j:5.26-community
    container_name: chatcrm_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - crmlite-network
    profiles:
      - graph

  # ── Redis Cache & PubSub (Offloaded to Cloud Redis) ──
  # redis:
  #   image: redis:7-alpine
  #   container_name: chatcrm_redis
  #   restart: unless-stopped
  #   command: ["redis-server", "--maxmemory", "10mb", "--maxmemory-policy", "allkeys-lru"]
  #   mem_limit: 14m
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - crmlite-network

  # ── Spring Boot Backend (Optimized for 1GB RAM Single Server Profile) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatcrm_backend
    restart: unless-stopped
    mem_limit: 1400m
    mem_reservation: 512m
    ports:
      - "8080:8080"
      - "50000-50100:50000-50100/udp"
    env_file:
      - .env
    environment:
      # 1GB Server Profile: Heap(380m) + Metaspace(160m) + CodeCache(48m) + SerialGC overhead ~= 640m < 720m limit
      JAVA_TOOL_OPTIONS: "-XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -Xms256m -Xmx900m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # Database and Redis are now loaded directly from .env (Cloud DB + Cloud Redis)
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      RAG_MODE: ${RAG_MODE:-VECTOR}
    # depends_on:
    #   db:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    networks:
      - crmlite-network

volumes:
  # postgres_data:
  # redis_data:
  neo4j_data:

networks:
  crmlite-network:
    driver: bridge
