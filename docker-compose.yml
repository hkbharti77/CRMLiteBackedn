services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chatcrm_db
    restart: always
    environment:
      POSTGRES_DB: chatcrmdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
