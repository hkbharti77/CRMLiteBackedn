# application-dev.properties
# =============================================================================
# Development-only overrides. Activated with: --spring.profiles.active=dev
# NEVER use these settings in production.
# =============================================================================

# SQL logging — helpful in dev, MUST be off in prod (performance + data leakage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose security logging for debugging filter chains
logging.level.org.springframework.security=DEBUG
logging.level.com.chatcrmlite=DEBUG
logging.level.io.jsonwebtoken=DEBUG

# SMTP debug output (shows SMTP handshake — never in prod)
spring.mail.properties.mail.debug=true

# Actuator — show full health details locally
management.endpoint.health.show-details=always

# Allow CORS from any localhost port in dev
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

# HikariCP Setup (Session Optimization for PostgreSQL vector index)
spring.datasource.writer.connection-init-sql=SET ivfflat.probes = 10;
spring.datasource.reader.connection-init-sql=SET ivfflat.probes = 10;

# ── Dev-only Security Overrides ───────────────────────────────────────────────
# SECURITY: Skip signature verification in LOCAL DEV only.
# Meta cannot reach localhost directly; set to false before any production deploy.
whatsapp.webhook.skip-signature-verification=true
