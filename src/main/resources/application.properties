# Load .env file automatically (optional)
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL Database Configuration (writer = primary, reader = replica / same DB in dev)
spring.application.name=backend
spring.datasource.writer.jdbc-url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chatcrmdb}
spring.datasource.writer.driver-class-name=org.postgresql.Driver
spring.datasource.writer.username=${DB_USERNAME:postgres}
spring.datasource.writer.password=${DB_PASSWORD:postgres}
spring.datasource.writer.hikari.max-lifetime=540000
spring.datasource.writer.hikari.keepalive-time=30000
spring.datasource.writer.hikari.maximum-pool-size=3
spring.datasource.writer.hikari.minimum-idle=1

spring.datasource.reader.jdbc-url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chatcrmdb}
spring.datasource.reader.driver-class-name=org.postgresql.Driver
spring.datasource.reader.username=${DB_USERNAME:postgres}
spring.datasource.reader.password=${DB_PASSWORD:postgres}
spring.datasource.reader.hikari.max-lifetime=540000
spring.datasource.reader.hikari.keepalive-time=30000
spring.datasource.reader.hikari.maximum-pool-size=3
spring.datasource.reader.hikari.minimum-idle=1

# Embedded Tomcat Memory Optimization (Ultra-low RAM profile)
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=3
server.tomcat.accept-count=30
server.tomcat.max-connections=500

# Hibernate Configuration (dialect auto-detected from JDBC connection)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable open-in-view: async workers must use explicit @Transactional boundaries
spring.jpa.open-in-view=false

# WhatsApp / Meta Configuration
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dummy_verify_token}
meta.app.id=${META_APP_ID:1573307991099476}
meta.config.id=${META_CONFIG_ID:1052344107323702}
meta.app-secret=${META_APP_SECRET:dummy_app_secret}
meta.graph-api-version=${META_GRAPH_API_VERSION:v21.0}
meta.api-base-url=${META_API_BASE_URL:https://graph.facebook.com}
# SECURITY: Signature verification must always be enabled in production.
# Override to true ONLY in application-dev.properties for local development.
whatsapp.webhook.skip-signature-verification=false


# Security Configuration
jwt.secret=${JWT_SECRET:dummy_jwt_secret_key_for_testing_min_64_bytes_long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — set to your real frontend URL(s) in production
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://gyanvaniaiconnect.qivantaai.in}

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:dummy_smtp_user}
spring.mail.password=${SMTP_PASSWORD:dummy_smtp_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${SENDER_EMAIL:no-reply@gyanvaniai.online}
# mail.debug=true leaks auth tokens to logs — disabled in production
spring.mail.properties.mail.debug=false
SENDER_EMAIL=no-reply@gyanvaniai.online
ADMIN_EMAIL=contact@gyanvaniai.online
FRONTEND_URL=http://localhost:3000
platform.brand.url=${PLATFORM_BRAND_URL:https://gyanvaniai.online}
platform.brand.name=${PLATFORM_BRAND_NAME:GyanVaniAi}



# Logging — WARN in production; override per-profile in application-dev.properties
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.com.chatcrmlite=INFO
logging.level.org.flywaydb=INFO



# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=10000
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

# WhatsApp Async Queue Configuration
whatsapp.async.stream.ingress=whatsapp:ingress:stream
whatsapp.async.stream.dlq=whatsapp:ingress:dlq
whatsapp.async.group=whatsapp-worker-group
whatsapp.async.worker.concurrency=5
whatsapp.async.max-retries=3
whatsapp.async.stream.max-len=10000

# WhatsApp Media Storage & Size Limits (Bytes)
whatsapp.media.max-image-size=${WHATSAPP_MEDIA_MAX_IMAGE_SIZE:16777216}
whatsapp.media.max-video-size=${WHATSAPP_MEDIA_MAX_VIDEO_SIZE:67108864}
whatsapp.media.max-audio-size=${WHATSAPP_MEDIA_MAX_AUDIO_SIZE:33554432}
whatsapp.media.max-document-size=${WHATSAPP_MEDIA_MAX_DOCUMENT_SIZE:104857600}
whatsapp.media.max-sticker-size=${WHATSAPP_MEDIA_MAX_STICKER_SIZE:5242880}

# Gemini AI Configuration
langchain4j.google-ai.gemini.api-key=${GEMINI_API_KEY:dummy_gemini_key}
langchain4j.google-ai.gemini.model-name=gemini-2.5-flash
langchain4j.google-ai.gemini.timeout=60s

# AI Configuration (google / openrouter / ollama / openai / local)
ai.provider=${AI_PROVIDER:openrouter}
ai.faq.matching-threshold=${AI_FAQ_THRESHOLD:0.75}
ai.cache.similarity-threshold=${AI_CACHE_THRESHOLD:0.85}

# OpenRouter Configuration (low-latency models: google/gemini-2.5-flash, openai/gpt-4o-mini, anthropic/claude-3-5-haiku)
ai.openrouter.api-key=${OPENROUTER_API_KEY:dummy_openrouter_key}
ai.openrouter.model-name=${OPENROUTER_MODEL_NAME:google/gemini-2.5-flash}
ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

# Ollama / OpenAI-compatible Local AI Endpoint Configuration
ai.openai.base-url=${AI_OPENAI_BASE_URL:http://10.215.46.176:8085/v1}
ai.openai.api-key=${AI_OPENAI_API_KEY:ollama}
ai.openai.model-name=${AI_OPENAI_MODEL_NAME:ggml-org/gemma-3-1b-it-GGUF:Q4_K_M}

# Cloudinary Media Storage Configuration
cloudinary.url=${CLOUDINARY_URL:cloudinary://dummy_key:dummy_secret@dummy_cloud}
storage.type=${STORAGE_TYPE:CLOUDINARY}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:dummy_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_razorpay_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:dummy_razorpay_webhook_secret}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:dummy_stripe_api_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:dummy_stripe_webhook_secret}

# Google Integration (OAuth & Calendar/Meet)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=http://api.gyanvaniai.online/api/v1/integrations/google/callback

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s

# Flyway Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=10074
spring.flyway.table=flyway_schema_history_3
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/chatcrmdb}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Public URL for Media (WhatsApp/Meta accessibility)
app.public.url=https://api.gyanvaniai.online

# Observability & Monitoring
# SECURITY: show-details=when-authorized prevents unauthenticated DB/disk info leakage
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# Distributed Tracing (OTEL)
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.otlp.logs.export.enabled=false
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Quartz Distributed Scheduling
spring.sql.init.mode=always
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# Pagination Stability — use DTO-based serialization to avoid PageImpl warnings
spring.data.web.pageable.serialization-mode=via-dto

# ── Resilience4j TimeLimiter ─────────────────────────────────────────────────
resilience4j.timelimiter.instances.geminiAi.timeout-duration=30s
resilience4j.timelimiter.instances.geminiAi.cancel-running-future=true
resilience4j.timelimiter.instances.whatsAppClient.timeout-duration=10s
resilience4j.timelimiter.instances.whatsAppClient.cancel-running-future=true
resilience4j.timelimiter.instances.ragRetrieval.timeout-duration=30s
resilience4j.timelimiter.instances.ragRetrieval.cancel-running-future=true

# ── Resilience4j Bulkhead ─────────────────────────────────────────────────────
resilience4j.bulkhead.instances.geminiAi.max-concurrent-calls=5
resilience4j.bulkhead.instances.geminiAi.max-wait-duration=2s
resilience4j.bulkhead.instances.whatsAppClient.max-concurrent-calls=10
resilience4j.bulkhead.instances.whatsAppClient.max-wait-duration=100ms
resilience4j.bulkhead.instances.ragRetrieval.max-concurrent-calls=3
resilience4j.bulkhead.instances.ragRetrieval.max-wait-duration=3s

# ── Resilience4j Retry (additional properties) ───────────────────────────────
resilience4j.retry.instances.geminiAi.max-attempts=3
resilience4j.retry.instances.geminiAi.wait-duration=2s
resilience4j.retry.instances.whatsAppClient.max-attempts=2
resilience4j.retry.instances.whatsAppClient.wait-duration=500ms
resilience4j.retry.instances.ragRetrieval.max-attempts=2
resilience4j.retry.instances.ragRetrieval.wait-duration=1s

spring.jackson.serialization.fail-on-empty-beans=false

# Razorpay Billing Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Stripe Billing Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_mock}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_mock}

spring.jackson.deserialization.read-unknown-enum-values-using-default-value=true

# Performance Monitoring Thresholds (in ms)
app.performance.threshold.db-ms=${DB_PERFORMANCE_THRESHOLD_MS:500}
app.performance.threshold.cache-ms=10
app.performance.threshold.regex-ms=10
app.performance.threshold.fuzzy-ms=30
# SECURITY: This key encrypts WhatsApp access tokens stored in the database.
# Supply the same value used when the database was originally populated.
# Changing this key makes all existing encrypted records unreadable.
# Must be at least 16 characters. Required — no default.
encryption.secret-key=${ENCRYPTION_SECRET_KEY}
