# ── Production Application Profile ──────────────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=prod

# ── Database (use env vars — no defaults for sensitive values) ───────────────
spring.datasource.writer.jdbc-url=${SPRING_DATASOURCE_URL}
spring.datasource.reader.jdbc-url=${SPRING_DATASOURCE_URL}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.flyway.url=${SPRING_DATASOURCE_URL}

# ── HikariCP (connection pooling tuned for production) ──────────────────────
spring.datasource.writer.hikari.maximum-pool-size=100
spring.datasource.writer.hikari.minimum-idle=5
spring.datasource.writer.hikari.connection-timeout=30000
spring.datasource.writer.hikari.idle-timeout=600000
spring.datasource.writer.hikari.max-lifetime=1800000
spring.datasource.writer.hikari.keepalive-time=300000
spring.datasource.writer.hikari.leak-detection-threshold=60000

spring.datasource.reader.hikari.maximum-pool-size=120
spring.datasource.reader.hikari.minimum-idle=5

# ── Tomcat (Tune to handle high concurrent HTTP load) ───────────────────────
server.tomcat.threads.max=600

# ── Flyway (safe production defaults) ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization (creates pgvector extension before Hibernate runs)
spring.sql.init.mode=always

# Flyway Configuration (Baselines the DB to ignore the messy local migration history on fresh prod DBs)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=10068
spring.flyway.validate-on-migrate=true

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.chatcrmlite=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ── Actuator Health — expose liveness/readiness for K8s probes ──────────────
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# ── Distributed Tracing (reduce to 10% sampling in production) ───────────────
management.tracing.sampling.probability=0.1
management.otlp.tracing.export.enabled=true
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://tempo:4317}

# ── Async stream tuning ──────────────────────────────────────────────────────
whatsapp.async.worker.concurrency=50
whatsapp.async.stream.max-len=50000

# Quartz (ensure cluster mode)
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# HikariCP Setup (Session Optimization for PostgreSQL vector index)
spring.datasource.writer.connection-init-sql=SET ivfflat.probes = 10;
spring.datasource.reader.connection-init-sql=SET ivfflat.probes = 10;

# ── Resilience4j Bulkhead Limits (Production Scale) ─────────────────────────
resilience4j.bulkhead.instances.geminiAi.max-concurrent-calls=100
resilience4j.bulkhead.instances.geminiAi.max-wait-duration=5s
resilience4j.bulkhead.instances.whatsAppClient.max-concurrent-calls=200
resilience4j.bulkhead.instances.whatsAppClient.max-wait-duration=2s
resilience4j.bulkhead.instances.ragRetrieval.max-concurrent-calls=50
resilience4j.bulkhead.instances.ragRetrieval.max-wait-duration=5s
