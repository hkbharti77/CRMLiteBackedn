<!DOCTYPE html>
<!--
  base.html — ChatCRM Lite Email Base Layout
  ==========================================
  Exposes two fragments used by every child template:

    th:fragment="header(heading, greeting, intro)"
      → renders the full outer wrapper + indigo header bar
        + body cell open with heading/greeting/intro pre-filled

    th:fragment="footer(footerNote, ctaLabel, ctaUrl)"
      → renders optional CTA button + footer note
        + closes body cell + footer bar + outer wrapper

  Child template pattern:
  ─────────────────────────────────────────────────────────────
  <div th:replace="~{email/base :: header(
        heading  = 'Booking Confirmed',
        greeting = 'Hi Rahul,',
        intro    = 'Your booking has been confirmed.')}">
  </div>

  ... detail tables, blockquotes, etc. ...

  <div th:replace="~{email/base :: footer(
        footerNote = 'We look forward to serving you.',
        ctaLabel   = 'View Booking',
        ctaUrl     = 'https://example.com')}">
  </div>
  ─────────────────────────────────────────────────────────────
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body>

<!-- ════════════════════════════════════════════════════════════════ -->
<!--  HEADER fragment                                                -->
<!--  Parameters: heading, greeting, intro                          -->
<!-- ════════════════════════════════════════════════════════════════ -->
<table th:fragment="header(heading, greeting, intro)"
       width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:40px 16px;font-family:Arial,Helvetica,sans-serif">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" role="presentation"
             style="background:#ffffff;border-radius:10px;overflow:hidden;
                    box-shadow:0 4px 16px rgba(0,0,0,1);max-width:600px;width:100%">

        <!-- Brand header bar -->
        <tr>
          <td style="background:#000000;
                     padding:26px 36px">
            <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
              <tr>
                <td>
                  <span style="color:#ffffff;font-size:21px;font-weight:700;
                               letter-spacing:-0.4px">
                    &#128172; ChatCRM Lite
                  </span>
                </td>
                <td align="right">
                  <span style="color:#ffffff;font-size:11px">
                    Smart CRM &middot; Powered by AI
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body cell -->
        <tr>
          <td style="padding:36px">

            <!-- Heading -->
            <h2 th:if="${heading != null and !#strings.isEmpty(heading)}"
                th:text="${heading}"
                style="margin:0 0 6px;color:#000000;font-size:22px;font-weight:700;
                       line-height:1.3">
              Heading
            </h2>
            <!-- Accent line -->
            <div th:if="${heading != null and !#strings.isEmpty(heading)}"
                 style="width:48px;height:3px;background:#008000;
                        border-radius:2px;margin:0 0 20px"></div>

            <!-- Greeting -->
            <p th:text="${greeting}"
               style="color:#000000;margin:0 0 8px;font-size:15px">
              Hi,
            </p>

            <!-- Intro -->
            <p th:text="${intro}"
               style="color:#000000;margin:0 0 20px;font-size:15px;line-height:1.6">
              Intro text.
            </p>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>


<!-- ════════════════════════════════════════════════════════════════ -->
<!--  FOOTER fragment                                                -->
<!--  Parameters: footerNote, ctaLabel (nullable), ctaUrl (nullable)-->
<!-- ════════════════════════════════════════════════════════════════ -->
<table th:fragment="footer(footerNote, ctaLabel, ctaUrl)"
       width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:0 16px 40px;font-family:Arial,Helvetica,sans-serif">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" role="presentation"
             style="background:#ffffff;border-radius:0 0 10px 10px;
                    max-width:600px;width:100%">

        <!-- CTA button (optional) -->
        <tr th:if="${ctaLabel != null and !#strings.isEmpty(ctaLabel)}">
          <td style="padding:0 36px 24px;text-align:center">
            <a th:href="${ctaUrl ?: '#'}"
               th:text="${ctaLabel}"
               style="display:inline-block;background:#008000;color:#ffffff;
                      padding:13px 32px;border-radius:7px;text-decoration:none;
                      font-weight:700;font-size:14px;
                      box-shadow:0 2px 8px rgba(0,128,0,1)">
              Action
            </a>
          </td>
        </tr>

        <!-- Footer note -->
        <tr>
          <td style="padding:0 36px 28px">
            <p th:text="${footerNote}"
               style="color:#000000;font-size:13px;margin:0;line-height:1.5">
              Footer note.
            </p>
          </td>
        </tr>

        <!-- Footer bar -->
        <tr>
          <td style="background:#ffffff;padding:18px 36px;
                     border-top:1px solid #000000;
                     border-radius:0 0 10px 10px">
            <p style="margin:0 0 4px;color:#000000;font-size:12px;text-align:center">
              &copy; 2026 ChatCRM Lite &middot; All rights reserved
            </p>
            <p style="margin:0;color:#000000;font-size:11px;text-align:center">
              This is an automated notification. Please do not reply to this email.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
