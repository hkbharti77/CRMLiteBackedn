<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'Enquiry Received'}">Enquiry Received</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <div class="card-subtle" style="background-color:#F8FAFC;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <p class="text-main" style="margin:0 0 10px;color:#111827;font-size:14px;font-weight:700;">
                💬 Your Submitted Message
              </p>
              <div class="card-bg" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:8px;padding:16px;color:#4B5563;font-size:14px;line-height:1.6;" th:text="${enquiryMessage}">
                Enquiry message text...
              </div>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
