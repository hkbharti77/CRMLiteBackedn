<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Enquiry Received</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f3f4f6;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <div th:if="${enquiryMessage != null and !#strings.isEmpty(enquiryMessage)}">
          <p style="color:#6b7280;font-size:13px;margin:0 0 8px;font-weight:600;
                    text-transform:uppercase;letter-spacing:0.5px">Your enquiry</p>
          <blockquote th:text="${enquiryMessage}"
                      style="border-left:4px solid #6366f1;margin:0 0 20px;padding:12px 16px;
                             background:#f5f5ff;color:#374151;font-size:14px;
                             line-height:1.6;border-radius:0 6px 6px 0">
            Enquiry.
          </blockquote>
        </div>

        <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:14px 16px">
          <p style="margin:0 0 6px;color:#0369a1;font-size:14px;font-weight:600">What happens next?</p>
          <ul style="margin:0;padding-left:18px;color:#0369a1;font-size:13px;line-height:1.9">
            <li>Our team reviews your enquiry</li>
            <li>We will contact you within 24 hours</li>
            <li>We will discuss the best options for you</li>
          </ul>
        </div>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
