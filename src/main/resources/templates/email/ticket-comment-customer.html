<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">New Reply</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f3f4f6;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <table style="width:100%;border-collapse:collapse;margin:0 0 20px">
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;width:36%;border:1px solid #e5e7eb">Ticket #</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;
                       border:1px solid #e5e7eb;font-family:monospace"
                th:text="${ticketNumber}">TKT-0001</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">Subject</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${subject}">Subject</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">Reply from</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${agentName}">Agent</td>
          </tr>
        </table>

        <p style="color:#6b7280;font-size:13px;margin:0 0 8px;font-weight:600;
                  text-transform:uppercase;letter-spacing:0.5px">Reply</p>
        <blockquote th:text="${comment}"
                    style="border-left:4px solid #6366f1;margin:0;padding:12px 16px;
                           background:#f5f5ff;color:#374151;font-size:14px;
                           line-height:1.6;border-radius:0 6px 6px 0">
          Comment.
        </blockquote>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=${ctaLabel},ctaUrl=${ctaUrl})}"></div>

</body>
</html>
