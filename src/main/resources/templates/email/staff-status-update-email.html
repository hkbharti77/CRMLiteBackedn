<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'Account Status Update'}">Status Update</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── STATUS BADGE CARD ────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F8FAFC;border:1px solid #E5E7EB;border-radius:14px;padding:24px;text-align:center;margin:0 0 28px;">
              <span th:if="${status == 'Blocked'}" class="pill-badge" style="background-color:#FEF2F2;color:#DC2626;border:1px solid #FCA5A5;font-size:13px;font-weight:700;padding:6px 18px;border-radius:9999px;display:inline-block;letter-spacing:0.5px;">
                🔴 ACCOUNT SUSPENDED / BLOCKED
              </span>
              <span th:if="${status != 'Blocked'}" class="pill-badge" style="background-color:#F0FDF4;color:#16A34A;border:1px solid #DCFCE7;font-size:13px;font-weight:700;padding:6px 18px;border-radius:9999px;display:inline-block;letter-spacing:0.5px;">
                🟢 ACCOUNT ACTIVE / UNBLOCKED
              </span>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <p class="text-main" style="margin:0 0 14px;color:#111827;font-size:14px;font-weight:700;">
                🏢 Workspace Status Details
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Organization:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${businessName}">Business</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">New Status:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${status}">Blocked</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Admin Reason:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${reason}">Reason</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
