<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Deal Confirmed</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f3f4f6;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac;
                    border-radius:8px;padding:20px;text-align:center;margin:0 0 20px">
          <div style="font-size:40px;margin:0 0 8px">&#127881;</div>
          <p style="margin:0;color:#166534;font-size:18px;font-weight:700">Deal Confirmed!</p>
          <p style="margin:6px 0 0;color:#15803d;font-size:14px">We are excited to work with you.</p>
        </div>

        <div th:if="${dealLabel != null and !#strings.isEmpty(dealLabel)}">
          <table style="width:100%;border-collapse:collapse">
            <tr>
              <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                         font-size:13px;width:36%;border:1px solid #e5e7eb">Deal</td>
              <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                  th:text="${dealLabel}">Deal label</td>
            </tr>
          </table>
        </div>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
