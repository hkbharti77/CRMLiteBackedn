<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${heading ?: 'Appointment Confirmed'}">Appointment Confirmed</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;">

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:0 12px;">
  <tr>
    <td align="center">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-left:1px solid #E2E8F0;border-right:1px solid #E2E8F0;">
        <tr>
          <td class="content-padding" style="padding:0 32px 24px;">

            <!-- ── CALENDAR EVENT HERO CARD ─────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:24px 20px;text-align:center;margin:0 0 20px;">
              <span class="pill-badge" style="background-color:#FFFFFF;color:#059669;border:1px solid #A7F3D0;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-block;letter-spacing:0.6px;text-transform:uppercase;">
                📅 APPOINTMENT CONFIRMED
              </span>

              <h2 class="text-main" th:text="${title}" style="margin:12px 0 6px;color:#0F172A;font-size:20px;font-weight:700;">
                Appointment Title
              </h2>

              <p class="otp-code" th:text="${dateTime}" style="margin:6px 0 0;color:#047857;font-size:16px;font-weight:700;">
                Date &amp; Time
              </p>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;padding:18px 20px;margin:0 0 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.7;">
                <tr>
                  <td class="text-muted" style="color:#64748B;width:120px;padding:4px 0;">Event Title:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${title}">Title</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Date &amp; Time:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${dateTime}">Date &amp; Time</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Organized By:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${businessName}">Business Name</td>
                </tr>
                <tr th:if="${meetingLink != null and !#strings.isEmpty(meetingLink)}">
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Virtual Link:</td>
                  <td style="padding:4px 0;">
                    <a th:href="${meetingLink}" th:text="${meetingLink}" style="color:#2563EB;font-weight:600;text-decoration:none;word-break:break-all;">https://meet.link</a>
                  </td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
