<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'Appointment Confirmed'}">Appointment Confirmed</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── CALENDAR EVENT HERO CARD ─────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F0FDF4;border:1px solid #DCFCE7;border-radius:14px;padding:28px 24px;text-align:center;margin:0 0 28px;">
              <!-- Calendar Vector SVG -->
              <div style="width:52px;height:52px;background-color:#FFFFFF;border:1px solid #DCFCE7;border-radius:50%;margin:0 auto 14px;line-height:52px;text-align:center;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline-block;">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                  <path d="m9 16 2 2 4-4"></path>
                </svg>
              </div>

              <h2 class="text-main" th:text="${title}" style="margin:0 0 6px;color:#111827;font-size:22px;font-weight:700;">
                Appointment Title
              </h2>

              <p class="otp-code" th:text="${dateTime}" style="margin:6px 0 14px;color:#16A34A;font-size:18px;font-weight:700;">
                Date &amp; Time
              </p>

              <span class="pill-badge" style="background-color:#FFFFFF;color:#16A34A;border:1px solid #DCFCE7;font-size:12px;font-weight:700;padding:5px 16px;border-radius:9999px;display:inline-block;">
                CONFIRMED
              </span>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <p class="text-main" style="margin:0 0 14px;color:#111827;font-size:14px;font-weight:700;">
                📅 Appointment Details
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Event Title:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${title}">Title</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Date &amp; Time:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${dateTime}">Date &amp; Time</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Hosted By:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${businessName}">Business</td>
                </tr>
                <tr th:if="${meetingLink != null and !#strings.isEmpty(meetingLink)}">
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Meeting Link:</td>
                  <td style="padding:4px 0;">
                    <a th:href="${meetingLink}" th:text="${meetingLink}" style="color:#16A34A;font-weight:600;text-decoration:none;word-break:break-all;">https://meet.link</a>
                  </td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
