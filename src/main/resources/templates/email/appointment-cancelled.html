<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Appointment Cancelled</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f3f4f6;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;
                    padding:16px;text-align:center;margin:0 0 20px">
          <p style="margin:0;color:#991b1b;font-size:16px;font-weight:700">&#10060; Appointment Cancelled</p>
        </div>

        <table style="width:100%;border-collapse:collapse">
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;width:36%;border:1px solid #e5e7eb">Appointment</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${title}">Title</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">Was Scheduled For</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${dateTime}">DateTime</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">With</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${businessName}">Business</td>
          </tr>
        </table>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
