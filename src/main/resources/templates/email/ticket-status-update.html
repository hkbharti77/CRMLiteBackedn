<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${subject ?: 'Ticket Status Updated'}">Status Updated</title>
</head>
<body>

<div th:replace="~{email/base :: header(
    heading  = ${heading},
    greeting = ${greeting},
    intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── STATUS TRANSITION HERO CARD ──────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F8FAFC;border:1px solid #E5E7EB;border-radius:14px;padding:28px 24px;text-align:center;margin:0 0 28px;">
              <p class="text-muted" style="margin:0 0 10px;color:#6B7280;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">
                Ticket #<span th:text="${ticketNumber}">TKT-0001</span> Status Change
              </p>

              <div style="margin:12px 0;">
                <span class="pill-badge" style="background-color:#F1F5F9;color:#475569;border:1px solid #CBD5E1;font-size:12px;font-weight:600;padding:4px 12px;border-radius:9999px;display:inline-block;" th:text="${oldStatus}">
                  OLD_STATUS
                </span>
                <span style="color:#9CA3AF;font-size:16px;margin:0 10px;">→</span>
                <span class="pill-badge" style="background-color:#F0FDF4;color:#16A34A;border:1px solid #DCFCE7;font-size:13px;font-weight:700;padding:6px 16px;border-radius:9999px;display:inline-block;" th:text="${newStatus}">
                  NEW_STATUS
                </span>
              </div>
            </div>

            <!-- Detail Card -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Ticket Subject:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${subject}">Subject</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Updated Status:</td>
                  <td class="text-main" style="color:#16A34A;font-weight:700;padding:4px 0;" th:text="${newStatus}">RESOLVED</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
    footerNote = ${footerNote},
    ctaLabel   = ${ctaLabel},
    ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
