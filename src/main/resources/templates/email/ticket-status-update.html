<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${subject ?: 'Ticket Status Updated'}">Status Updated</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;">

<div th:replace="~{email/base :: header(
    heading  = ${heading},
    greeting = ${greeting},
    intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:0 12px;">
  <tr>
    <td align="center">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-left:1px solid #E2E8F0;border-right:1px solid #E2E8F0;">
        <tr>
          <td class="content-padding" style="padding:0 32px 24px;">

            <!-- ── STATUS TRANSITION HERO CARD ──────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:24px 20px;text-align:center;margin:0 0 24px;">
              <p class="text-subtle" style="margin:0 0 10px;color:#64748B;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">
                Ticket #<span th:text="${ticketNumber}">TKT-0001</span> Status Update
              </p>

              <div style="margin:12px 0;">
                <span class="pill-badge" style="background-color:#F1F5F9;color:#475569;border:1px solid #CBD5E1;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;display:inline-block;" th:text="${oldStatus}">
                  PREVIOUS
                </span>
                <span style="color:#94A3B8;font-size:16px;margin:0 8px;font-weight:bold;">&rarr;</span>
                <span class="pill-badge" style="background-color:#ECFDF5;color:#059669;border:1px solid #A7F3D0;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;display:inline-block;" th:text="${newStatus}">
                  NEW_STATUS
                </span>
              </div>
            </div>

            <!-- ── DETAIL CARD ─────────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;padding:18px 20px;margin:0 0 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.7;">
                <tr>
                  <td class="text-muted" style="color:#64748B;width:120px;padding:4px 0;">Ticket Subject:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${subject}">Subject</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Current Status:</td>
                  <td class="text-main" style="color:#059669;font-weight:700;padding:4px 0;" th:text="${newStatus}">RESOLVED</td>
                </tr>
                <tr th:if="${statusMessage != null and !#strings.isEmpty(statusMessage)}">
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Update Details:</td>
                  <td class="text-muted" style="color:#475569;padding:4px 0;" th:text="${statusMessage}">Our team is actively working on your ticket.</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
    footerNote = ${footerNote},
    ctaLabel   = ${ctaLabel},
    ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
