<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">High Value Lead</title></head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <table style="width:100%;border-collapse:collapse;margin:0 0 20px">
          <tr>
            <td style="padding:9px 14px;background:#ffffff;font-weight:600;color:#000000;
                       font-size:13px;width:36%;border:1px solid #000000">Lead Name</td>
            <td style="padding:9px 14px;color:#000000;font-size:13px;
                       border:1px solid #000000;font-family:monospace"
                th:text="${leadName}">John Doe</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#ffffff;font-weight:600;color:#000000;
                       font-size:13px;border:1px solid #000000">Calculated Score</td>
            <td style="padding:9px 14px;color:#000000;font-size:13px;border:1px solid #000000"
                th:text="${score}">85</td>
          </tr>
        </table>
        
        <p style="color:#000000;font-size:14px;line-height:1.6;margin:0">
          This lead has scored very highly based on their provided details and AI analysis. Please log in to your CRM and follow up with them immediately.
        </p>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=${ctaLabel},ctaUrl=${ctaUrl})}"></div>

</body>
</html>
