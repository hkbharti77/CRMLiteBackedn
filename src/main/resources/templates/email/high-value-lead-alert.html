<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${heading ?: 'High Value Lead Alert'}">High Value Lead Alert</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:0 12px;">
  <tr>
    <td align="center">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-left:1px solid #E2E8F0;border-right:1px solid #E2E8F0;">
        <tr>
          <td class="content-padding" style="padding:0 32px 24px;">

            <!-- ── AI LEAD SCORE HIGHLIGHT CARD ─────────────────────────────── -->
            <div class="card-subtle" style="background-color:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:24px 20px;text-align:center;margin:0 0 20px;">
              <span class="pill-badge" style="background-color:#FFFFFF;color:#059669;border:1px solid #A7F3D0;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-block;letter-spacing:0.6px;text-transform:uppercase;">
                ⚡ AI SCORING ENGINE ALERT
              </span>
              
              <div style="margin:12px 0 6px;">
                <span class="otp-code" th:text="${score}" style="font-size:48px;font-weight:800;color:#047857;letter-spacing:-1px;">85</span>
                <span class="text-subtle" style="font-size:18px;color:#64748B;font-weight:600;">/ 100</span>
              </div>

              <h2 class="text-main" th:text="${leadName}" style="margin:4px 0 0;color:#0F172A;font-size:18px;font-weight:700;">
                High Value Lead Name
              </h2>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;padding:18px 20px;margin:0 0 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.7;">
                <tr>
                  <td class="text-muted" style="color:#64748B;width:120px;padding:4px 0;">Prospect Name:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${leadName}">John Doe</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Calculated Score:</td>
                  <td class="text-main" style="color:#059669;font-weight:700;padding:4px 0;">
                    <span th:text="${score}">85</span> (High Intent Opportunity)
                  </td>
                </tr>
              </table>
            </div>

            <p class="text-muted" style="color:#475569;font-size:13px;line-height:1.5;margin:0;">
              This prospective lead has scored very highly based on AI behavioral and intent analysis. Log in to your CRM workspace to prioritize outreach immediately.
            </p>

          </td>
        </tr>
      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=${ctaLabel},ctaUrl=${ctaUrl})}"></div>

</body>
</html>
