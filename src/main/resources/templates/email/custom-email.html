<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${subject ?: 'Notification'}">Broadcast Message</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* ── RESET & BASE STYLES ────────────────────────────────────────── */
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-width: 100% !important;
      height: 100% !important;
      background-color: #F8FAFC !important;
      -webkit-text-size-adjust: 100% !important;
      -ms-text-size-adjust: 100% !important;
    }
    div[style*="margin: 16px 0"] { margin: 0 !important; }
    table, td {
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
      border-collapse: collapse !important;
    }
    img {
      border: 0 !important;
      height: auto !important;
      line-height: 100% !important;
      outline: none !important;
      text-decoration: none !important;
      -ms-interpolation-mode: bicubic !important;
    }
    a { text-decoration: none; color: inherit; }
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }
    body, table, td, p, a, li, blockquote, span, h1, h2, h3 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
    }
    @media (prefers-color-scheme: dark) {
      .body-bg { background-color: #0B0F19 !important; }
      .card-bg { background-color: #151E2E !important; border-color: #26334D !important; }
      .text-main { color: #F1F5F9 !important; }
      .text-muted { color: #94A3B8 !important; }
      .footer-bg { background-color: #101726 !important; border-color: #26334D !important; }
    }
    [data-ogsc] .body-bg { background-color: #0B0F19 !important; }
    [data-ogsc] .card-bg { background-color: #151E2E !important; border-color: #26334D !important; }
    [data-ogsc] .text-main { color: #F1F5F9 !important; }
    [data-ogsc] .text-muted { color: #94A3B8 !important; }

    @media only screen and (max-width: 600px) {
      .fluid-container { width: 100% !important; max-width: 100% !important; }
      .header-padding { padding: 20px 16px 14px !important; }
      .content-padding { padding: 20px 16px !important; }
      .footer-padding { padding: 18px 16px !important; }
      .btn-cta { width: 100% !important; display: block !important; box-sizing: border-box !important; text-align: center !important; }
    }
  </style>
</head>
<body class="body-bg" style="margin:0;padding:0;background-color:#F8FAFC;word-spacing:normal;">

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:32px 12px;">
  <tr>
    <td align="center">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);">
        
        <!-- Top Accent Line -->
        <tr>
          <td height="4" th:style="'height:4px;background-color:' + (${primaryColor} ?: '#2563EB') + ';background-image:linear-gradient(90deg, ' + (${primaryColor} ?: '#2563EB') + ' 0%, #4F46E5 100%);'"></td>
        </tr>

        <!-- Custom Header with Logo -->
        <tr>
          <td class="header-padding" align="center" style="padding:28px 32px 16px;border-bottom:1px solid #F1F5F9;">
            <div th:if="${logoUrl != null and !#strings.isEmpty(logoUrl)}" style="margin-bottom:8px;">
              <img th:src="${logoUrl}" alt="Logo" style="max-height:48px;max-width:200px;object-fit:contain;display:block;margin:0 auto;border:0;" />
            </div>
            <div th:unless="${logoUrl != null and !#strings.isEmpty(logoUrl)}">
              <span class="text-main" style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.4px;" th:text="${businessName ?: 'GyanVaniAi Connect'}">Business Name</span>
            </div>
          </td>
        </tr>

        <!-- Body Content -->
        <tr>
          <td class="content-padding" style="padding:32px 32px;">
            <div class="text-main" style="color:#334155;font-size:15px;line-height:1.7;margin:0;" th:utext="${body}">
              Email campaign body content...
            </div>
            
            <!-- Dynamic CTA Button -->
            <div th:if="${ctaUrl != null and !#strings.isEmpty(ctaUrl)}" style="text-align:center;margin-top:32px;">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" th:href="${ctaUrl}" style="height:44px;v-text-anchor:middle;width:240px;" arcsize="14%" stroke="f" th:attr="fillcolor=${primaryColor ?: '#2563EB'}">
                <w:anchorlock/>
                <center style="color:#ffffff;font-family:sans-serif;font-size:14px;font-weight:bold;" th:text="${ctaLabel ?: 'Learn More'}">Action</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <a class="btn-cta" th:href="${ctaUrl}" th:text="${ctaLabel ?: 'Learn More'}"
                 th:style="'display:inline-block;padding:12px 32px;color:#FFFFFF !important;font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;border-radius:8px;background-color:' + (${primaryColor} ?: '#2563EB') + ';box-shadow:0 2px 4px rgba(37,99,235,0.2);'">
                 Action Button
              </a>
              <!--<![endif]-->
            </div>
          </td>
        </tr>

        <!-- Custom Footer -->
        <tr>
          <td class="footer-bg footer-padding" align="center" style="background-color:#F8FAFC;padding:24px 32px;border-top:1px solid #F1F5F9;text-align:center;">
            <p class="text-muted" style="color:#64748B;font-size:12px;margin:0 0 6px;line-height:1.5;">
              This email was sent by <strong class="text-main" th:text="${businessName ?: 'GyanVaniAi Connect'}" style="color:#0F172A;">Business Name</strong>.
            </p>
            <p th:if="${businessAddress != null and !#strings.isEmpty(businessAddress)}" class="text-subtle" style="color:#94A3B8;font-size:11px;margin:0;line-height:1.4;" th:text="${businessAddress}">
              123 Business St, City, Country
            </p>
          </td>
        </tr>

      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
      
      <!-- Tracking / Unsubscribe spacer -->
      <div style="padding-top:16px;"></div>
      
    </td>
  </tr>
</table>

</body>
</html>
