<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Message</title></head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(
    heading  = '',
    greeting = '',
    intro    = '')}">
</div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <!-- Business name badge -->
        <p style="margin:0 0 20px">
          <span style="background:#ffffff;color:#008000;padding:4px 12px;
                       border-radius:20px;font-size:13px;font-weight:600;
                       border:1px solid #000000"
                th:text="${businessName}">Business</span>
        </p>

        <!-- Tenant-written body -->
        <div style="color:#000000;font-size:15px;line-height:1.8;margin:0 0 28px"
             th:utext="${body}">
          Email body.
        </div>

        <!-- Unsubscribe note -->
        <p style="color:#000000;font-size:11px;margin:0;text-align:center;line-height:1.5">
          You are receiving this email because you are a customer of
          <span th:text="${businessName}">Business</span>.
          If you no longer wish to receive these emails, please contact us directly.
        </p>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(
    footerNote = '',
    ctaLabel   = ${ctaLabel},
    ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
