<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'New Appointment Scheduled'}">New Appointment Alert</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom:12px;">
                <tr>
                  <td>
                    <span class="text-main" style="color:#111827;font-size:14px;font-weight:700;">
                      📅 Calendar Event Details
                    </span>
                  </td>
                  <td align="right">
                    <span class="pill-badge" style="background-color:#F0FDF4;color:#16A34A;border:1px solid #DCFCE7;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;">
                      NEW EVENT
                    </span>
                  </td>
                </tr>
              </table>

              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Event Title:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${title}">Title</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Date &amp; Time:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${dateTime}">Date &amp; Time</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Client Name:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${contactName}">Client Name</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Client Email:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${contactEmail}">client@example.com</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
