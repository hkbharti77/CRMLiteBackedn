<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">New Appointment</title></head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <table style="width:100%;border-collapse:collapse">
          <tr>
            <td style="padding:9px 14px;background:#ffffff;font-weight:600;color:#000000;
                       font-size:13px;width:36%;border:1px solid #000000">Customer</td>
            <td style="padding:9px 14px;color:#000000;font-size:13px;border:1px solid #000000">
              <span th:text="${contactName}">Name</span>
              &nbsp;&middot;&nbsp;
              <a th:href="'mailto:' + ${contactEmail}" th:text="${contactEmail}"
                 style="color:#008000;text-decoration:none">email</a>
            </td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#ffffff;font-weight:600;color:#000000;
                       font-size:13px;border:1px solid #000000">Appointment</td>
            <td style="padding:9px 14px;color:#000000;font-size:13px;border:1px solid #000000"
                th:text="${title}">Title</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#ffffff;font-weight:600;color:#000000;
                       font-size:13px;border:1px solid #000000">Date &amp; Time</td>
            <td style="padding:9px 14px;color:#000000;font-size:13px;border:1px solid #000000"
                th:text="${dateTime}">DateTime</td>
          </tr>
        </table>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=${ctaLabel},ctaUrl=${ctaUrl})}"></div>

</body>
</html>
