<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${subject ?: 'Following Up'}">Follow Up</title>
</head>
<body>

<div th:replace="~{email/base :: header(heading='Following Up',greeting='Hi ' + ${contactName} + ',',intro='')}"></div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── FOLLOWBACK CONTENT CONTAINER ─────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:24px;margin:0 0 24px;">
              <div th:utext="${content}" class="text-main" style="color:#111827;font-size:15px;line-height:1.7;">
                Template content goes here.
              </div>
            </div>

            <p class="text-muted" style="color:#4B5563;font-size:14px;line-height:1.5;margin:0;">
              Best regards,<br/>
              <strong class="text-main" th:text="${businessName}" style="color:#111827;">Your Business</strong>
            </p>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(footerNote='You received this because you contacted us.',ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
