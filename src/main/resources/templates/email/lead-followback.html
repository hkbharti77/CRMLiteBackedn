<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Follow Up</title></head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading='Following up',greeting='Hi ' + ${contactName} + ',',intro='')}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#ffffff;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <div th:utext="${content}" style="color:#000000;font-size:14px;line-height:1.6;margin:0 0 20px">
          Template content goes here.
        </div>
        
        <p style="color:#000000;font-size:14px;line-height:1.6;margin:0">
          Best regards,<br/>
          <strong th:text="${businessName}">Your Business</strong>
        </p>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote='You received this because you contacted us.',ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
