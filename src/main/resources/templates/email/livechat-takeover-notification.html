<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title>Chat Takeover Notice</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;">

<div th:replace="~{email/base :: header(
    heading  = 'Notice: Live Chat Taken Over',
    greeting = ${greeting},
    intro    = 'A live support session has been taken over by a team supervisor.')}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:0 12px;">
  <tr>
    <td align="center">
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-left:1px solid #E2E8F0;border-right:1px solid #E2E8F0;">
        <tr>
          <td class="content-padding" style="padding:0 32px 24px;">

            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;padding:20px;margin:0 0 16px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin-bottom:14px;border-bottom:1px solid #F1F5F9;padding-bottom:12px;">
                <tr>
                  <td>
                    <span class="text-main" style="color:#0F172A;font-size:14px;font-weight:700;">
                      ⚡ Chat Session Update
                    </span>
                  </td>
                  <td align="right">
                    <span class="pill-badge" style="background-color:#FEF3C7;color:#D97706;border:1px solid #FDE68A;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">
                      TAKEN OVER
                    </span>
                  </td>
                </tr>
              </table>

              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.7;">
                <tr>
                  <td class="text-muted" style="color:#64748B;width:140px;padding:4px 0;">Taken Over By:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:700;padding:4px 0;" th:text="${takeoverByName}">Supervisor Name</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Customer Name:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${customerName}">Customer Name</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Customer Phone:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${customerPhone}">Phone Number</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#64748B;padding:4px 0;">Reason / Note:</td>
                  <td class="text-main" style="color:#0F172A;font-weight:600;padding:4px 0;" th:text="${reason ?: 'N/A'}">Reason</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
    footerNote = 'This notification has been sent to all staff members of the tenant for transparency.',
    ctaLabel   = 'View Dashboard',
    ctaUrl     = '#')}">
</div>

</body>
</html>
