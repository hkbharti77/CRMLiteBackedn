<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'Lead Won'}">Lead Won Alert</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── REVENUE WON METRIC CARD ──────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F0FDF4;border:1px solid #DCFCE7;border-radius:14px;padding:28px 24px;text-align:center;margin:0 0 28px;">
              <span class="pill-badge" style="background-color:#FFFFFF;color:#16A34A;border:1px solid #DCFCE7;font-size:12px;font-weight:700;padding:5px 16px;border-radius:9999px;display:inline-block;letter-spacing:0.5px;">
                🏆 CLOSED WON
              </span>
              <div class="otp-code" style="font-size:36px;font-weight:800;color:#16A34A;margin:10px 0 4px;">
                <span th:text="${currency}">$</span><span th:text="${dealValue}">10,000</span>
              </div>
              <p class="text-main" th:text="${dealLabel}" style="margin:0;color:#111827;font-size:16px;font-weight:700;">
                Deal Name
              </p>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Customer Name:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${contactName}">Contact Name</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Customer Email:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${contactEmail}">contact@example.com</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Deal Label:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${dealLabel}">Deal Label</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
