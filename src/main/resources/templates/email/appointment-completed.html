<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title th:text="${heading ?: 'Appointment Completed'}">Appointment Completed</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;">

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;margin:0;padding:0 12px;">
  <tr>
    <td align="center">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg fluid-container" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:0 auto;background-color:#FFFFFF;border-left:1px solid #E2E8F0;border-right:1px solid #E2E8F0;">
        <tr>
          <td class="content-padding" style="padding:0 32px 24px;">

            <!-- ── COMPLETED HERO CARD ────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:24px 20px;text-align:center;margin:0 0 20px;">
              <span class="pill-badge" style="background-color:#FFFFFF;color:#059669;border:1px solid #A7F3D0;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-block;letter-spacing:0.6px;text-transform:uppercase;">
                ✓ APPOINTMENT COMPLETED
              </span>
              <h2 class="text-main" th:text="${title}" style="margin:12px 0 6px;color:#0F172A;font-size:20px;font-weight:700;">
                Title
              </h2>
              <p class="text-muted" th:text="${businessName}" style="margin:0;color:#059669;font-weight:600;font-size:14px;">
                Business Name
              </p>
            </div>

          </td>
        </tr>
      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
