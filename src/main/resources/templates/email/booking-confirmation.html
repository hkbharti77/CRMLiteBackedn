<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title th:text="${subject}">Booking Confirmed</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif">

<div th:replace="~{email/base :: header(heading=${heading},greeting=${greeting},intro=${intro})}"></div>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background:#f3f4f6;padding:0 16px;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" role="presentation"
           style="background:#ffffff;max-width:600px;width:100%">
      <tr><td style="padding:0 36px 24px">

        <div style="background:#f5f5ff;border:1px solid #c7d2fe;border-radius:8px;
                    padding:20px;margin:0 0 20px;text-align:center">
          <div style="font-size:36px;margin:0 0 8px">&#128197;</div>
          <p style="margin:0;color:#4338ca;font-size:16px;font-weight:700" th:text="${service}">Service</p>
          <p th:if="${preferredSlot != null and !#strings.isEmpty(preferredSlot)}"
             style="margin:8px 0 0;color:#6366f1;font-size:15px" th:text="${preferredSlot}">Slot</p>
        </div>

        <table style="width:100%;border-collapse:collapse;margin:0 0 20px">
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;width:36%;border:1px solid #e5e7eb">Service</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${service}">Service</td>
          </tr>
          <tr th:if="${preferredSlot != null and !#strings.isEmpty(preferredSlot)}">
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">Preferred Slot</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${preferredSlot}">Slot</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">With</td>
            <td style="padding:9px 14px;color:#374151;font-size:13px;border:1px solid #e5e7eb"
                th:text="${businessName}">Business</td>
          </tr>
          <tr>
            <td style="padding:9px 14px;background:#f9fafb;font-weight:600;color:#374151;
                       font-size:13px;border:1px solid #e5e7eb">Status</td>
            <td style="padding:9px 14px;font-size:13px;border:1px solid #e5e7eb">
              <span style="background:#16a34a;color:#fff;padding:2px 10px;
                           border-radius:12px;font-size:12px;font-weight:600">CONFIRMED</span>
            </td>
          </tr>
        </table>

        <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:12px 16px">
          <p style="margin:0;color:#92400e;font-size:13px">
            &#9200; Please arrive a few minutes early. Contact us if you need to reschedule.
          </p>
        </div>

      </td></tr>
    </table>
  </td></tr>
</table>

<div th:replace="~{email/base :: footer(footerNote=${footerNote},ctaLabel=null,ctaUrl=null)}"></div>

</body>
</html>
