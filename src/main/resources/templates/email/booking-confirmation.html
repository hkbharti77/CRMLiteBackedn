<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${heading ?: 'Booking Confirmed'}">Booking Confirmed</title>
</head>
<body>

<div th:replace="~{email/base :: header(
      heading  = ${heading},
      greeting = ${greeting}, 
      intro    = ${intro})}">
</div>

<table class="body-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#F8FAFC;padding:0 16px;">
  <tr>
    <td align="center">
      <!--[if mso]>
      <table align="center" width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;">
      <tr>
      <td align="center" valign="top" width="600">
      <![endif]-->
      <table class="card-bg" width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FFFFFF;border-left:1px solid #E5E7EB;border-right:1px solid #E5E7EB;">
        <tr>
          <td style="padding:0 36px 28px;">

            <!-- ── BOOKING HERO CARD ────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#F0FDF4;border:1px solid #DCFCE7;border-radius:14px;padding:28px 24px;text-align:center;margin:0 0 28px;">
              <span class="pill-badge" style="background-color:#FFFFFF;color:#16A34A;border:1px solid #DCFCE7;font-size:12px;font-weight:700;padding:5px 16px;border-radius:9999px;display:inline-block;letter-spacing:0.5px;">
                CONFIRMED BOOKING
              </span>
              <h2 class="text-main" th:text="${service}" style="margin:12px 0 6px;color:#111827;font-size:22px;font-weight:700;">
                Service Name
              </h2>
              <p class="otp-code" th:text="${preferredSlot}" style="margin:6px 0 0;color:#16A34A;font-size:17px;font-weight:700;">
                Preferred Time Slot
              </p>
            </div>

            <!-- ── DETAILS CARD ───────────────────────────────────────────── -->
            <div class="card-subtle" style="background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:20px 24px;margin:0 0 28px;">
              <p class="text-main" style="margin:0 0 14px;color:#111827;font-size:14px;font-weight:700;">
                📋 Service Summary
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="font-size:13px;line-height:1.8;">
                <tr>
                  <td class="text-muted" style="color:#6B7280;width:110px;padding:4px 0;">Service:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${service}">Service</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Selected Slot:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${preferredSlot}">Preferred Slot</td>
                </tr>
                <tr>
                  <td class="text-muted" style="color:#6B7280;padding:4px 0;">Provider:</td>
                  <td class="text-main" style="color:#111827;font-weight:600;padding:4px 0;" th:text="${businessName}">Business</td>
                </tr>
              </table>
            </div>

          </td>
        </tr>
      </table>
      <!--[if mso]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>
</table>

<div th:replace="~{email/base :: footer(
      footerNote = ${footerNote},
      ctaLabel   = ${ctaLabel},
      ctaUrl     = ${ctaUrl})}">
</div>

</body>
</html>
