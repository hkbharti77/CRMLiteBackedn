# Test profile — uses H2 in-memory database for both writer and reader
spring.datasource.writer.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.writer.driver-class-name=org.h2.Driver
spring.datasource.writer.username=sa
spring.datasource.writer.password=
spring.datasource.writer.maximum-pool-size=50
spring.datasource.writer.minimum-idle=5
spring.datasource.writer.hikari.maximum-pool-size=50
spring.datasource.writer.hikari.minimum-idle=5

spring.datasource.reader.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.reader.driver-class-name=org.h2.Driver
spring.datasource.reader.username=sa
spring.datasource.reader.password=
spring.datasource.reader.maximum-pool-size=50
spring.datasource.reader.minimum-idle=5
spring.datasource.reader.hikari.maximum-pool-size=50
spring.datasource.reader.hikari.minimum-idle=5

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false



# Disable Flyway for tests — DDL is managed by Hibernate create-drop
spring.flyway.enabled=false
spring.sql.init.schema-locations=classpath:test-schema.sql


# Disable Redisson and Spring Data Redis auto-configuration in test profile
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.data.redis.repositories.enabled=false
spring.main.allow-bean-definition-overriding=true

# Disable Actuator health indicators for tests
management.defaults.health.enabled=false
management.health.mail.enabled=false

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

# Disable AI warmup
langchain4j.google-ai.gemini.api-key=

# Enable root and Spring framework logging for tests
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.io.github.resilience4j=WARN
logging.level.org.springframework.security=WARN
logging.level.com.chatcrmlite=INFO

# ── Test-only dummy secrets (NOT real credentials — test profile only) ────────
# SecureConfigValidator is @Profile("!test") and does NOT run in tests.
jwt.secret=test-jwt-secret-not-for-production-use-only
whatsapp.verify-token=test-verify-token
meta.app-secret=test-meta-app-secret
cloudinary.url=cloudinary://test:test@test
encryption.secret-key=TestEncryptionKey1
whatsapp.webhook.skip-signature-verification=false
