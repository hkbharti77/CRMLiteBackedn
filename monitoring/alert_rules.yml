groups:
  - name: crmlite.application
    rules:

      # ── Error Rate ─────────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{status=~"5.."}[5m]) /
          rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "{{ $value | humanizePercentage }} of requests are failing (threshold: 5%)"

      # ── Latency ──────────────────────────────────────────────────────────
      - alert: SlowP99Latency
        expr: |
          histogram_quantile(0.99,
            rate(http_server_requests_seconds_bucket[5m])
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 response latency is high"
          description: "P99 latency is {{ $value }}s (threshold: 3s)"

      # ── JVM Memory ───────────────────────────────────────────────────────
      - alert: JvmHeapHigh
        expr: |
          jvm_memory_used_bytes{area="heap"} /
          jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap memory above 85%"
          description: "{{ $value | humanizePercentage }} of heap used"

  - name: crmlite.redis_streams
    rules:

      # ── Stream Backlog ─────────────────────────────────────────────────
      - alert: IngressStreamBacklog
        expr: workflow_stream_depth{stream="ingress"} > 500
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "WhatsApp ingress stream backlog growing"
          description: "Stream depth is {{ $value }} messages"

      - alert: IngressStreamCritical
        expr: workflow_stream_depth{stream="ingress"} > 2000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical ingress stream backlog — messages may expire"

  - name: crmlite.database
    rules:

      # ── Connection Pool ───────────────────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of DB connections in use"

  - name: crmlite.circuit_breakers
    rules:

      # ── Circuit Breaker Open ──────────────────────────────────────────
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN"
          description: "Downstream service is unhealthy — requests are being fast-failed"
