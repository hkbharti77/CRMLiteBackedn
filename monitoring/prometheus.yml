global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    app: 'crmlite'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Add: ['alertmanager:9093'] when configured

scrape_configs:

  # ── CRMLite Spring Boot Application ─────────────────────────────────────────
  - job_name: 'crmlite-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          group: 'application'
          service: 'backend'

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          group: 'database'
          service: 'postgresql'

  # ── Redis ────────────────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          group: 'cache'
          service: 'redis'

  # ── Prometheus Self-Monitoring ───────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
